name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt ruff

      - name: Lint
        run: ruff check app demo scripts tests

      - name: Parse upstream synchronization script (no network, no push)
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'scripts/sync_upstream_expert.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Tests
        run: pytest -q

      - name: Verify current Laravel develop contract (read-only)
        run: python -m scripts.check_laravel_contract --upstream

      - name: Gate - Rule regressions on pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:data/rules.json" > "$RUNNER_TEMP/rules-baseline.json"
          if cmp -s "$RUNNER_TEMP/rules-baseline.json" data/rules.json; then
            echo "## HU-14 · Sin modificaciones de rules.json" >> "$GITHUB_STEP_SUMMARY"
            echo "La puerta de regresiones no requiere evaluar esta propuesta." >> "$GITHUB_STEP_SUMMARY"
          else
            python -m scripts.check_rule_regression \
              --baseline "$RUNNER_TEMP/rules-baseline.json" \
              --candidate data/rules.json \
              --scenarios data/scenarios.json \
              --json-output "$RUNNER_TEMP/rule-regression.json"
          fi

      - name: Gate - Code behavior regression on pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE_SHA" HEAD -- app/expert_system app/services/recommendation_service.py app/schemas/recommendation.py data/rules.json; then
            echo "## HU-17 · Sin cambios al código de inferencia" >> "$GITHUB_STEP_SUMMARY"
          else
            python -m scripts.behavior_guard generate \
              --scenarios data/scenarios.json --output "$RUNNER_TEMP/expert-cases.json"
            python -m scripts.behavior_guard snapshot \
              --cases "$RUNNER_TEMP/expert-cases.json" \
              --output "$RUNNER_TEMP/expert-candidate.json"
            git worktree add --detach "$RUNNER_TEMP/expert-baseline" "$BASE_SHA"
            (
              cd "$RUNNER_TEMP/expert-baseline"
              PYTHONPATH="$RUNNER_TEMP/expert-baseline" \
                python "$GITHUB_WORKSPACE/scripts/behavior_guard.py" snapshot \
                  --cases "$RUNNER_TEMP/expert-cases.json" \
                  --output "$RUNNER_TEMP/expert-baseline.json"
            )
            python -m scripts.behavior_guard compare \
              --baseline "$RUNNER_TEMP/expert-baseline.json" \
              --candidate "$RUNNER_TEMP/expert-candidate.json" \
              --max-index-shift 10
          fi

      - name: HU-31 - Weight sensitivity and critical-rule guard (no external requests)
        run: |
          python -m scripts.calibrate_convenience_weights \
            --with-grid --json-output "$RUNNER_TEMP/weight-calibration.json"

      - name: Lightweight expert benchmark (no external requests)
        run: python -m scripts.benchmark_inference --iterations 300
